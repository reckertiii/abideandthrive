# Run with: docker compose up -d --build
# Also usable on TrueNAS SCALE via Apps > Discover Apps > Custom App > "Install via YAML" (see README).
services:
  abide:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"            # on TrueNAS pick a free host port, e.g. "8090:3000"
    environment:
      SITE_URL: "http://localhost:3000"   # the address you type in the browser (e.g. http://192.168.1.50:8090)
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "change-me-please-123"
      # SQUARE_ENV: sandbox
      # SQUARE_ACCESS_TOKEN: ""
      # SQUARE_LOCATION_ID: ""
      # RESEND_API_KEY: ""
      # MAIL_FROM: ""
    volumes:
      - abide-data:/data       # on TrueNAS use a dataset path, e.g. /mnt/tank/apps/abide/data:/data
volumes:
  abide-data:
